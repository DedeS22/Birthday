<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fanie Show</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff0f5;
      text-align: center;
      padding: 40px;
    }
    .screen {
      display: none;
    }
    .active {
      display: block;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
    }
    #slideshow-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .slideshow img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .birthday-message {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .sub-message {
      font-size: 18px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Opening Screen -->
  <div id="start-screen" class="screen active">
    <h1>Welcome to Fanie Show!</h1>
    <p>Let's have a little quiz!</p>
    <button onclick="startQuiz()">Continue to Quiz</button>
  </div>

  <!-- Quiz Screens -->
  <div id="quiz-screen" class="screen">
    <h2 id="question"></h2>
    <div id="options"></div>
  </div>

  <!-- Slideshow Screen -->
  <div id="slideshow-screen" class="screen">
    <div class="birthday-message">Happy Birthday Sayang!</div>
    <div class="sub-message">Wish you all the best!</div>
    <div class="slideshow">
      <img id="slideshow-image" src="" alt="Fanie Photo"/>
    </div>
    <audio id="birthday-audio" autoplay loop>
      <source src="lagubirthday.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const questions = [
      {
        question: "Apa makanan kesukaan/comfort food Fanie?",
        options: ["Rendang", "Soto", "Babi"],
        answer: "Soto"
      },
      {
        question: "Fanie pingin banget beli apa akhir akhir ini?",
        options: ["Chocolatos", "Membership Pilates", "Kamera Ricoh"],
        answer: "Kamera Ricoh"
      },
      {
        question: "Kapan ulang tahun Fanie?",
        options: ["Hari ini dungz", "Apa itu ulang tahun?", "Eternity"],
        answer: "Hari ini dungz"
      }
    ];

    let currentQuestion = 0;

    function startQuiz() {
      document.getElementById("start-screen").classList.remove("active");
      document.getElementById("quiz-screen").classList.add("active");
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").textContent = q.question;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (selected === questions[currentQuestion].answer) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          showQuestion();
        } else {
          showSlideshow();
        }
      } else {
        alert("Yah salah! Balik ke awal ya~");
        location.reload();
      }
    }

    function showSlideshow() {
      document.getElementById("quiz-screen").classList.remove("active");
      document.getElementById("slideshow-screen").classList.add("active");

      const images = ["Fanie1.jpg", "Fanie2.jpg", "Fanie3.jpg", "Fanie4.jpg", "Fanie5.jpg"];
      let idx = 0;
      const img = document.getElementById("slideshow-image");

      img.src = images[idx];
      setInterval(() => {
        idx = (idx + 1) % images.length;
        img.src = images[idx];
      }, 2500);
    }
  </script>
</body>
</html>
